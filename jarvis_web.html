<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS AI Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #00ff00;
            text-align: center;
            padding: 20px;
        }
        #output {
            margin: 20px;
            font-size: 1.2em;
        }
        button {
            background-color: #00ff00;
            color: #000;
            border: none;
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
            font-size: 1em;
        }
        button:hover {
            background-color: #00cc00;
        }
        input {
            padding: 10px;
            width: 80%;
            max-width: 400px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <h1>JARVIS AI Assistant</h1>
    <div id="output">Hello, I am JARVIS. How can I assist you today?</div>
    <input type="text" id="textInput" placeholder="Type your command">
    <button onclick="sendText()">Send</button>
    <button onclick="startVoice()">Start Voice</button>
    <button onclick="stopVoice()">Stop Voice</button>

    <script src="jarvis_client.js"></script>
</body>
</html>
